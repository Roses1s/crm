[project]
name = "crm-backend"
version = "0.1.0"
description = "CRM Detroid — FastAPI backend"
# В продакшене образ собирается на Python 3.13 (см. Dockerfile).
# Нижняя граница 3.11 оставлена, чтобы код запускался и на машинах разработчиков.
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Синхронный драйвер для задач Celery (там нет цикла событий).
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "passlib[bcrypt]>=1.7.4",
    # bcrypt 5.0 несовместим с passlib 1.7.4: при определении бэкенда passlib
    # пробует пароль длиннее 72 байт, а bcrypt 5 на этом падает вместо обрезки.
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.20",
    "celery[redis]>=5.5",
    # redis-клиент (протокол Valkey совместим с Redis).
    # Ставим без extra [redis] у fastapi-cache2: тот extra тянет redis<5.
    "redis>=5.2",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.19",
    "slowapi>=0.1.9",
    "fastapi-cache2>=0.2.2",
    # fastapi-cache2 импортирует starlette.templating -> требует jinja2
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ----------------------------------------------------------------------------
#  Ruff — линтер и форматтер (заменяет flake8 + isort + black)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "B008",    # Depends(...) в аргументах по умолчанию — идиома FastAPI
    "RUF001",  # «неоднозначные» кириллические символы: проект на русском
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ----------------------------------------------------------------------------
#  Mypy — статическая типизация
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "fastapi_cache.*", "passlib.*", "celery.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
#  Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]
