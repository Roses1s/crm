# -----------------------------------------------------------------------------
#  ВРЕМЕННЫЙ конфиг (ЭТАП 1, шаг 10) — только HTTP, без SSL.
#  Нужен, чтобы Let's Encrypt смог проверить, что домен наш.
#  Кладётся на сервер как /opt/crm/nginx/conf.d/crmdetroid.ru.conf
#  и ПЕРЕЗАПИСЫВАЕТСЯ полным конфигом после выпуска сертификата (шаг 12).
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name crmdetroid.ru www.crmdetroid.ru;

    # Проверка владения доменом (ACME http-01). Certbot кладёт сюда файл,
    # Let's Encrypt его читает по http://crmdetroid.ru/.well-known/acme-challenge/...
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Служебный адрес для healthcheck контейнера
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
