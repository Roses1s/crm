# -----------------------------------------------------------------------------
#  Параметры TLS (современный «intermediate»-профиль Mozilla).
#  Путь на сервере: /opt/crm/nginx/snippets/ssl.conf
#  Подключается строкой: include /etc/nginx/snippets/ssl.conf;
# -----------------------------------------------------------------------------

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling — браузер быстрее проверяет, что сертификат не отозван
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/letsencrypt/live/crmdetroid.ru/chain.pem;

# DNS-резолвер нужен nginx для OCSP-запросов
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
