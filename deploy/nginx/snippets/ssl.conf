# -----------------------------------------------------------------------------
#  Параметры TLS (современный «intermediate»-профиль Mozilla).
#  Путь на сервере: /opt/crm/nginx/snippets/ssl.conf
#  Подключается строкой: include /etc/nginx/snippets/ssl.conf;
# -----------------------------------------------------------------------------

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling намеренно НЕ включаем: с 2025 года Let's Encrypt не добавляет
# OCSP-адрес в сертификаты (перешли на CRL), и nginx выдаёт предупреждение
# "ssl_stapling ignored, no OCSP responder URL in the certificate".
# Резолвер тоже не нужен: имена сервисов внутри docker-сети (backend, frontend)
# разрешает встроенный DNS Docker.
