# -----------------------------------------------------------------------------
#  Заголовки безопасности. Путь: /opt/crm/nginx/snippets/security-headers.conf
#  ВАЖНО: HSTS включаем только когда HTTPS уже точно работает (иначе браузер
#  запомнит домен как «только https» и откатиться будет тяжело).
# -----------------------------------------------------------------------------

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content-Security-Policy: браузер выполняет только те ресурсы, что перечислены.
# Разбор по частям:
#   default-src 'self'      — всё своё, сторонние источники запрещены;
#   style-src ... 'unsafe-inline' — Tailwind и React ставят стили атрибутом
#                             style="", без этого разрешения вёрстка ломается;
#   fonts.googleapis/gstatic — шрифт Inter подключается из index.css;
#   img-src data: blob:     — миниатюры и предпросмотр вложений собираются
#                             в памяти браузера (createObjectURL);
#   frame-src blob:         — предпросмотр PDF открывается во вложенном окне;
#   object-src 'none'       — Flash и подобное давно не нужны;
#   frame-ancestors 'self'  — сайт нельзя встроить в чужую страницу.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
