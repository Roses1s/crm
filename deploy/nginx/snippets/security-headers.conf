# -----------------------------------------------------------------------------
#  Заголовки безопасности. Путь: /opt/crm/nginx/snippets/security-headers.conf
#  ВАЖНО: HSTS включаем только когда HTTPS уже точно работает (иначе браузер
#  запомнит домен как «только https» и откатиться будет тяжело).
# -----------------------------------------------------------------------------

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
