# -----------------------------------------------------------------------------
#  Боевой конфиг сайта crmdetroid.ru (ЭТАП 1, шаг 12 — после выпуска сертификата)
#  Путь на сервере: /opt/crm/nginx/conf.d/crmdetroid.ru.conf
#
#  Схема:
#    http://*            -> 301 на https://crmdetroid.ru   (кроме ACME и /healthz)
#    https://www....     -> 301 на https://crmdetroid.ru   (канонический домен без www)
#    https://crmdetroid.ru -> сайт (сейчас заглушка, на этапе 4 — фронт + /api)
# -----------------------------------------------------------------------------

# --- 1. HTTP: ACME + редирект на HTTPS ---------------------------------------
server {
    listen 80;
    server_name crmdetroid.ru www.crmdetroid.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://crmdetroid.ru$request_uri;
    }
}

# --- 2. HTTPS www -> без www --------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.crmdetroid.ru;

    ssl_certificate     /etc/letsencrypt/live/crmdetroid.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmdetroid.ru/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    return 301 https://crmdetroid.ru$request_uri;
}

# --- 3. HTTPS основной сайт ---------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name crmdetroid.ru;

    ssl_certificate     /etc/letsencrypt/live/crmdetroid.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmdetroid.ru/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ==========================================================================
    #  ЭТАП 4: раскомментировать, когда поднимем контейнеры backend и frontend.
    #  До тех пор nginx отдаёт статическую заглушку из /var/www/html.
    # ==========================================================================
    #
    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    #
    # location / {
    #     proxy_pass http://frontend:80;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
