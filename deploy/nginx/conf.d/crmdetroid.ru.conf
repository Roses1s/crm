# -----------------------------------------------------------------------------
#  Боевой конфиг сайта crmdetroid.ru
#  Путь на сервере: /opt/crm/deploy/nginx/conf.d/crmdetroid.ru.conf
#
#  Схема:
#    http://*              -> 301 на https://crmdetroid.ru  (кроме ACME и /healthz)
#    https://www....       -> 301 на https://crmdetroid.ru
#    https://crmdetroid.ru -> /api/ в backend, всё остальное во frontend
# -----------------------------------------------------------------------------

# --- 1. HTTP: проверка домена + редирект на HTTPS -----------------------------
server {
    listen 80;
    server_name crmdetroid.ru www.crmdetroid.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://crmdetroid.ru$request_uri;
    }
}

# --- 2. HTTPS www -> без www --------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.crmdetroid.ru;

    ssl_certificate     /etc/letsencrypt/live/crmdetroid.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmdetroid.ru/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    return 301 https://crmdetroid.ru$request_uri;
}

# --- 3. HTTPS основной сайт ---------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name crmdetroid.ru;

    ssl_certificate     /etc/letsencrypt/live/crmdetroid.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crmdetroid.ru/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Служебные ручки API (используются мониторингом и docker healthcheck).
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # --- Вход: отдельный лимит на перебор паролей -----------------------------
    # burst=10 — короткая очередь: человек, быстро повторивший попытку, пройдёт,
    # а поток запросов от скрипта получит 429. Зона описана в 00-common.conf.
    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;

        proxy_pass http://backend:8000/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- API ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Загрузка вложений может идти дольше обычного запроса.
        proxy_read_timeout 120s;
    }

    # Документация API закрыта в продакшене самим приложением,
    # но на всякий случай не пускаем к ней и снаружи.
    location = /docs      { return 404; }
    location = /openapi.json { return 404; }

    # --- Фронтенд -------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
