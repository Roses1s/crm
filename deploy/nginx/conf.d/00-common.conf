# -----------------------------------------------------------------------------
#  Общие настройки nginx (контекст http). Путь: /opt/crm/nginx/conf.d/00-common.conf
# -----------------------------------------------------------------------------

# Не показывать версию nginx в заголовках и на страницах ошибок
server_tokens off;

# Максимальный размер запроса: небольшой запас на multipart-заголовки сверх лимита файла 25 МиБ.
client_max_body_size 26m;
client_body_timeout 30s;

# Таймауты до бэкенда
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# --- Защита формы входа от перебора паролей ----------------------------------
# Считаем попытки входа по IP-адресу. 20 попыток в минуту с одного адреса —
# живому человеку хватает с запасом, а программному перебору нет.
# Зона на 10 МБ хранит около 160 тысяч адресов.
# Это «внешний» рубеж: в самом приложении ограничение тоже есть (10/мин),
# но nginx отсекает перебор раньше — не доходя до базы и Valkey.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

# Слишком частым запросам отвечаем 429 «Слишком много запросов»
# (по умолчанию nginx отдаёт 503, который выглядит как поломка сервера).
limit_req_status 429;

# Сжатие текстовых ответов — фронтенд грузится заметно быстрее
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# Логи в stdout/stderr контейнера -> видно через `docker compose logs nginx`
