# -----------------------------------------------------------------------------
#  Общие настройки nginx (контекст http). Путь: /opt/crm/nginx/conf.d/00-common.conf
# -----------------------------------------------------------------------------

# Не показывать версию nginx в заголовках и на страницах ошибок
server_tokens off;

# Максимальный размер загружаемого файла (аватарки, вложения в сделках)
client_max_body_size 25m;
client_body_timeout 30s;

# Таймауты до бэкенда (пригодятся на этапе 4)
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Сжатие текстовых ответов — фронтенд грузится заметно быстрее
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# Логи в stdout/stderr контейнера -> видно через `docker compose logs nginx`
