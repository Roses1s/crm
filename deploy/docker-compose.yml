# =============================================================================
#  CRM Detroid — инфраструктура (ЭТАП 1: только Nginx-шлюз)
#  Путь на сервере: /opt/crm/docker-compose.yml
#
#  Сейчас здесь один сервис — nginx 1.27 (reverse-proxy + выдача статики).
#  На ЭТАПЕ 4 сюда добавятся: postgres, valkey, backend (FastAPI),
#  worker (Celery), frontend (React build). Файл специально написан так,
#  чтобы его можно было расширять, ничего не ломая.
# =============================================================================

name: crm

services:
  nginx:
    image: nginx:1.27-alpine        # версия зафиксирована: ровно 1.27
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"                     # HTTP  (нужен для ACME-проверки и редиректа на HTTPS)
      - "443:443"                   # HTTPS
    volumes:
      # Конфиги nginx (правим на хосте — контейнер пересоздавать не нужно, хватит reload)
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Статическая заглушка (на этапе 4 заменится на собранный фронтенд)
      - ./www:/var/www/html:ro
      # Каталог, куда Certbot кладёт файл-подтверждение владения доменом
      - ./certbot/www:/var/www/certbot:ro
      # Сертификаты Let's Encrypt с хоста (только на чтение)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge

networks:
  edge:
    name: crm_edge
