# Конфиг nginx внутри контейнера фронтенда: только отдача статики.
# Внешний nginx (edge) проксирует сюда запросы не про /api/.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Файлы сборки содержат хеш в имени: их можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируется: иначе после деплоя видна старая версия.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Одностраничное приложение: любой маршрут отдаёт index.html,
    # дальше разбирается React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
