# Автоматические обновления зависимостей.
#
# Dependabot раз в неделю проверяет обновления и присылает pull request'ы —
# отдельно для бэкенда (Python), фронтенда (npm) и самих GitHub Actions.
# Обновления безопасности приходят по мере обнаружения уязвимостей.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(ci)"
