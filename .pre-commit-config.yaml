# Проверки перед коммитом: pre-commit install
# Разовый прогон по всему репозиторию: pre-commit run --all-files
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # --- Python (backend/) ---------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # entry — не жёстко backend/.venv/bin/mypy: у части контрибьюторов venv
      # называется иначе или окружение активировано другим менеджером
      # (uv/pyenv). scripts/run-backend-check.sh сам находит интерпретатор:
      # VIRTUAL_ENV -> backend/.venv -> system python3.
      - id: mypy
        name: mypy (backend)
        entry: scripts/run-backend-check.sh mypy app
        language: system
        types: [python]
        files: ^backend/app/
        pass_filenames: false

      - id: pytest
        name: pytest (backend)
        entry: scripts/run-backend-check.sh pytest -q
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      # --- Frontend ---------------------------------------------------------
      - id: tsc
        name: tsc (frontend)
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
